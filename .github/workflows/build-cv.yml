name: Build CV
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      - name: Compile English CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: DavideChirichella_CV_ENG.tex
      - name: Compile Italian CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: DavideChirichella_CV_IT.tex
      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CV-PDFs
          path: |
            DavideChirichella_CV_ENG.pdf
            DavideChirichella_CV_IT.pdf
      - name: Update Latest Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest CV
          files: |
            DavideChirichella_CV_ENG.pdf
            DavideChirichella_CV_IT.pdf
          body: "Ultima versione generata automaticamente dal ramo main (EN e IT)."
      - name: Trigger website rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "SITE_DISPATCH_TOKEN not set; the site will pick up the CV at its daily rebuild."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/chirichexe/chirichexe.github.io/dispatches \
            -d '{"event_type":"cv-updated"}'
